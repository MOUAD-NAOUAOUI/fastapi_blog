{% extends "layout.html" %}
{% block content %}
  <article class="content-section py-3 px-4 mb-4">
    <div class="d-flex align-items-start gap-4">
      <img class="rounded-circle article-img flex-shrink-0"
           src="{{ url_for('static', path='profile_pics/default.jpg') }}"
           alt="{{ post.author }}'s profile picture"
           width="64"
           height="64"
           loading="lazy">
      <div class="flex-grow-1">
        <div class="article-metadata mb-2">
          <a class="me-2" href="#">{{ post.author }}</a>
          <small class="text-body-secondary">{{ post.date_posted }}</small>
        </div>
        <h2 class="article-title">{{ post.title }}</h2>
        <p class="article-content">{{ post.content }}</p>
        <!-- Only show edit/delete options if the user is the author -->
        <!-- TODO: Add user authentication checks -->
        <div class="mt-3 pt-3 border-top">
          <a class="btn btn-secondary btn-sm mt-1 mb-1" href="#">Edit Post</a>
          <button type="button"
                  class="btn btn-danger btn-sm m-1"
                  data-bs-toggle="modal"
                  data-bs-target="#deleteModal">Delete</button>
        </div>
      </div>
    </div>
  </article>
  <!-- Delete Modal -->
  <div class="modal fade"
       id="deleteModal"
       tabindex="-1"
       aria-labelledby="deleteModalLabel"
       aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteModalLabel">Delete Post?</h5>
          <button type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"></button>
        </div>
        <div class="modal-footer">
          <button type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal">Close</button>
          <form action="#" method="POST">
            <input class="btn btn-danger" type="submit" value="Delete">
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
